x-rabbit-env: &rabbit-env
  RabbitMQ__HostName: rabbitmq
  RabbitMQ__Port: "5672"
  RabbitMQ__UserName: admin
  RabbitMQ__Password: admin1234
  RabbitMQ__VirtualHost: /

services:
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin1234
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api-notifications:
    build:
      context: .                                # raiz da solução
      dockerfile: Fiap.Notifications.Api/Dockerfile
    container_name: container-api-notifications
    ports:
      - "8083:8083"
    environment:
      <<: *rabbit-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8083
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app_net
    restart: on-failure

volumes:
  rabbitmq_data:

networks:
  app_net:
    driver: bridge
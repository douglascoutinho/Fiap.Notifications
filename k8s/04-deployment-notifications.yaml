apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api-deployment
  labels:
    app: svc-notifications-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-notifications-api
  template:
    metadata:
      labels:
        app: svc-notifications-api
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rabbitmq-service 5672; do echo "aguardando rabbitmq..."; sleep 2; done
      containers:
        - name: container-notifications-api
          image: douglasloc/src-api-notifications:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: configmap-rabbitmq
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8083"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
